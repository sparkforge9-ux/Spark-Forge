<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SparkForge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f4f6ff',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            950: '#0f172a',
                        },
                        neon: {
                            cyan: '#38bdf8',
                            purple: '#c084fc',
                            emerald: '#34d399',
                            amber: '#fbbf24',
                            rose: '#fb7185'
                        }
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 3s ease-in-out infinite',
                        'pop-in': 'popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
                        'shimmer': 'shimmer 2.5s infinite linear',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { opacity: '0.3', transform: 'scale(1)' },
                            '50%': { opacity: '0.6', transform: 'scale(1.05)' },
                        },
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.8) translateY(24px)' },
                            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
                        },
                        shimmer: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' },
                        },
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-border:focus-within {
            box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.5);
        }
        .btn-pop {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-pop:hover {
            transform: scale(1.06) translateY(-2px);
        }
        .btn-pop:active {
            transform: scale(0.94);
        }
        .shimmer-btn {
            background: linear-gradient(90deg, #6366f1 0%, #a855f7 50%, #6366f1 100%);
            background-size: 200% 100%;
            animation: shimmer 3s infinite linear;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center overflow-x-hidden selection:bg-brand-500 selection:text-white p-4">

    <div class="fixed top-1/4 left-10 w-96 h-96 bg-brand-500/10 rounded-full blur-3xl pointer-events-none animate-pulse-glow"></div>
    <div class="fixed bottom-1/4 right-10 w-96 h-96 bg-neon-purple/10 rounded-full blur-3xl pointer-events-none animate-pulse-glow" style="animation-delay: 1.5s;"></div>

    <div class="relative z-10 max-w-md w-full text-center space-y-6 animate-pop-in glass-card p-8 rounded-3xl border border-slate-800 shadow-2xl">
        <a href="dashboard.html" class="flex justify-end -mt-2 -mr-2 text-slate-400 hover:text-white p-1" aria-label="Back to dashboard">
            <i data-lucide="x" class="w-5 h-5"></i>
        </a>

        <div class="mx-auto w-16 h-16 bg-gradient-to-tr from-brand-600 via-neon-cyan to-neon-purple p-0.5 rounded-2xl shadow-lg flex items-center justify-center -mt-6">
            <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
                <i data-lucide="zap" class="w-8 h-8 text-brand-400"></i>
            </div>
        </div>

        <h1 class="text-2xl font-black tracking-wider text-white uppercase">
            Spark<span class="bg-gradient-to-r from-brand-400 to-neon-cyan bg-clip-text text-transparent">Forge</span> Auth
        </h1>

        <div id="authErrorMsg" class="hidden text-xs text-rose-400 bg-rose-500/10 border border-rose-500/30 p-3 rounded-xl"></div>
        <div id="authSuccessMsg" class="hidden text-xs text-neon-emerald bg-neon-emerald/10 border border-neon-emerald/30 p-3 rounded-xl"></div>

        <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4 text-left">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                <input type="email" id="authEmail" required placeholder="name@example.com" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                <input type="password" id="authPassword" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500">
            </div>

            <div class="flex items-center justify-between text-xs pt-1">
                <label class="flex items-center space-x-2 text-slate-400 cursor-pointer">
                    <input type="checkbox" id="isSignUpMode" class="rounded bg-slate-900 border-slate-700 text-brand-500 focus:ring-0">
                    <span>Create new account (Sign Up)</span>
                </label>
                <button type="button" onclick="handlePasswordReset()" class="text-brand-400 hover:underline">Forgot password?</button>
            </div>

            <button type="submit" id="authSubmitBtn" class="btn-pop w-full shimmer-btn py-3.5 text-white font-bold rounded-xl text-sm shadow-lg shadow-brand-500/30 flex items-center justify-center space-x-2">
                <span id="authBtnText">Sign In</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <div class="relative flex py-2 items-center">
            <div class="flex-grow border-t border-slate-800"></div>
            <span class="flex-shrink mx-4 text-xs text-slate-500 uppercase">Or continue with</span>
            <div class="flex-grow border-t border-slate-800"></div>
        </div>

        <button onclick="handleGoogleSignIn()" class="btn-pop w-full bg-slate-900 hover:bg-slate-850 border border-slate-800 text-slate-200 py-3 rounded-xl text-sm font-semibold flex items-center justify-center space-x-2 transition-colors">
            <svg class="w-4 h-4" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Sign in with Google</span>
        </button>

        <p class="text-xs text-slate-500">Not ready yet? <a href="dashboard.html" class="text-brand-400 hover:underline">Browse the Idea Bank first</a></p>
    </div>

    <script type="module">
        import { app } from './firebase-init.js';
        import {
            getAuth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            onAuthStateChanged,
            GoogleAuthProvider,
            signInWithPopup,
            sendPasswordResetEmail,
            sendEmailVerification
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        lucide.createIcons();

        const authErrorMsg = document.getElementById('authErrorMsg');
        const authSuccessMsg = document.getElementById('authSuccessMsg');
        const isSignUpCheckbox = document.getElementById('isSignUpMode');
        const authBtnText = document.getElementById('authBtnText');

        isSignUpCheckbox.addEventListener('change', (e) => {
            authBtnText.innerText = e.target.checked ? "Sign Up" : "Sign In";
        });

        // Already signed in? Skip straight to the dashboard.
        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = 'dashboard.html';
        });

        window.handleAuthSubmit = async function(e) {
            e.preventDefault();
            authErrorMsg.classList.add('hidden');
            authSuccessMsg.classList.add('hidden');

            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const isSignUp = isSignUpCheckbox.checked;

            try {
                if (isSignUp) {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    await sendEmailVerification(userCredential.user);
                    authSuccessMsg.classList.remove('hidden');
                    authSuccessMsg.innerText = "Account created! Verification email sent. Please check your inbox.";
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1800);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                authErrorMsg.classList.remove('hidden');
                if (error.code === 'auth/email-already-in-use') {
                    authErrorMsg.innerText = "User already exists. Please sign in";
                } else {
                    authErrorMsg.innerText = "Email or password is incorrect";
                }
            }
        };

        window.handleGoogleSignIn = async function() {
            authErrorMsg.classList.add('hidden');
            try {
                await signInWithPopup(auth, googleProvider);
                window.location.href = 'dashboard.html';
            } catch (error) {
                authErrorMsg.classList.remove('hidden');
                authErrorMsg.innerText = "Google sign-in failed. Please try again.";
            }
        };

        window.handlePasswordReset = async function() {
            const email = document.getElementById('authEmail').value.trim();
            authErrorMsg.classList.add('hidden');
            authSuccessMsg.classList.add('hidden');

            if (!email) {
                authErrorMsg.classList.remove('hidden');
                authErrorMsg.innerText = "Please enter your email address first to reset password.";
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);
                authSuccessMsg.classList.remove('hidden');
                authSuccessMsg.innerText = "Password reset email sent. Check your inbox.";
            } catch (error) {
                authErrorMsg.classList.remove('hidden');
                authErrorMsg.innerText = "Unable to send password reset email.";
            }
        };
    </script>
</body>
</html>
